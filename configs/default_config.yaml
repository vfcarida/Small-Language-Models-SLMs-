# ==============================================================================
# CENTRALIZED HYPERPARAMETER CONFIGURATION — SLM MASTERCLASS
# ==============================================================================
# Single source of truth for model selection, dataset preparation, PEFT/LoRA,
# QLoRA, SFT, On-Policy Knowledge Distillation (GKD), Wanda Pruning, AWQ
# Quantization, DPO/SimPO Alignment, Evaluation, and Hybrid Routing.
# ==============================================================================

model:
  # Qwen2.5-1.5B provides an optimal Pareto balance between logical reasoning
  # capability and VRAM footprint (fits comfortably within an 8GB GPU budget).
  base_model_id: "Qwen/Qwen2.5-1.5B"
  torch_dtype: "bfloat16" # Prevents FP16 exponent overflow and NaN gradients
  device_map: "auto"
  trust_remote_code: true

dataset:
  # Instruction-following dataset from the Hugging Face Hub
  name: "tatsu-lab/alpaca"
  split: "train"
  # Set to 5000 for balanced single-GPU training, or 200 for rapid smoke runs
  max_samples: 5000
  test_size: 0.1
  seed: 42

lora:
  # Capacity vs. Memory Trade-off:
  # r=8:  Minimal memory footprint for narrow domain tasks
  # r=16: Production sweet spot for instruction tuning
  # r=32: High adapter capacity for dense multi-task adaptation
  r: 16
  lora_alpha: 32 # Standard scaling factor: alpha = 2 * r
  lora_dropout: 0.05
  bias: "none"
  # Dettmers et al. (2023) demonstrated that adapting all linear projections
  # ("all-linear") matches full fine-tuning quality.
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4" # NormalFloat4 (information-theoretically optimal for normal weights)
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

sft:
  output_dir: "./results/sft_output"
  num_train_epochs: 3
  # Per-device batch size of 2 prevents CUDA Out-Of-Memory (OOM) on 8GB VRAM GPUs
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  # Gradient accumulation preserves an effective batch size of 16 (2 * 8)
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: false
  bf16: true
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 200
  eval_strategy: "steps"
  eval_steps: 200
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  report_to: "none"
  seed: 42
  gradient_checkpointing: true

distillation:
  teacher_model_id: "Qwen/Qwen2.5-7B-Instruct"
  temperature: 2.0
  lmbda: 0.5   # On-policy student trajectory fraction (Agarwal et al., ICLR 2024)
  beta: 0.5    # Generalized Jensen-Shannon Divergence interpolation coefficient
  mode: "jsd"  # Options: "forward_kl", "reverse_kl" (MiniLLM), or "jsd" (GKD)

pruning:
  sparsity_ratio: 0.5
  sparsity_type: "unstructured" # Options: "unstructured" or "2:4" (NVIDIA semi-structured)
  num_calibration_samples: 32

quantization:
  zero_point: true
  q_group_size: 128
  w_bit: 4
  alpha: 0.5   # AWQ salient-channel activation-weight balance exponent
  version: "GEMM"

dpo:
  algorithm: "dpo" # Options: "dpo" (Rafailov et al., 2023) or "simpo" (Meng et al., 2024)
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-7
  beta: 0.1
  gamma: 0.5   # Target reward margin for reference-free SimPO
  max_length: 1024
  max_prompt_length: 512

routing:
  slm_model_id: "Qwen/Qwen2.5-1.5B-Instruct-AWQ"
  llm_model_id: "meta-llama/Llama-3.1-70B-Instruct"
  confidence_threshold: 0.65
  complexity_threshold: 0.60
  enforce_local_on_pii: true
  slm_cost_per_1m_tokens_usd: 0.08
  llm_cost_per_1m_tokens_usd: 2.40

evaluation:
  output_dir: "./results/eval_output"

logging:
  results_dir: "./results"
