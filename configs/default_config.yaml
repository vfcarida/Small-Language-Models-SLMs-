# ==============================================================================
# CONFIGURAÇÃO CENTRAL DE HIPERPARÂMETROS — SLM MASTERCLASS
# ==============================================================================
# Este arquivo concentra todas as variáveis necessárias para treinar,
# avaliar e fazer deploy dos modelos. Alterações feitas aqui refletem em
# toda a pipeline (run_full_pipeline.py).
# ==============================================================================

model:
  # O modelo base que será treinado. Qwen2.5-1.5B oferece o melhor equilíbrio
  # entre capacidade lógica e uso de VRAM (cabe perfeitamente em 8GB).
  base_model_id: "Qwen/Qwen2.5-1.5B"
  torch_dtype: "bfloat16" # Recomendado para arquiteturas modernas (evita NaN)
  device_map: "auto"
  trust_remote_code: true

dataset:
  # AJUSTE ESTRATÉGICO (IDIOMA):
  # Originalmente "tatsu-lab/alpaca" (inglês). Trocamos para a versão da USP.
  # Isso força o modelo a aprender o padrão de resposta e estilo no nosso idioma.
  name: "turing-usp/alpaca-pt-br"
  split: "train"
  
  # AJUSTE PARA TESTE RÁPIDO:
  # Para treinar de verdade, deixe null ou 50000.
  # Para testar se a pipeline roda sem quebrar a memória, altere para 200.
  max_samples: 5000
  test_size: 0.1
  seed: 42

lora:
  # AJUSTE DE CAPACIDADE vs VELOCIDADE:
  # r=8: Treino mais rápido, usa menos memória, bom para tarefas fáceis.
  # r=16: O padrão ouro atual. Equilíbrio perfeito (Usado aqui).
  # r=32: Aumenta a capacidade de aprendizado, mas dobra o tamanho do adaptador.
  r: 16
  lora_alpha: 32 # Regra geral: alpha deve ser 2x o valor do r
  lora_dropout: 0.05
  bias: "none"
  # Dettmers (2023) provou que aplicar LoRA em todas as lineares ("all-linear") 
  # iguala a performance do Full Fine-Tuning.
  target_modules: "all-linear" 
  task_type: "CAUSAL_LM"

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4" # NormalFloat4 (informacionalmente ótimo para pesos)
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

sft:
  output_dir: "./results/sft_output"
  num_train_epochs: 3
  
  # AJUSTE DE HARDWARE (VRAM):
  # Reduzimos o batch size por dispositivo de 4 para 2. Isso garante que o 
  # modelo não dê erro de Out Of Memory (OOM) em placas com exatos 8GB.
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  
  # Como reduzimos o batch acima, compensamos dobrando a acumulação de gradientes
  # (de 4 para 8). O "batch real" continua sendo 16 (2 * 8), mantendo o loss estável.
  gradient_accumulation_steps: 8
  
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: false
  bf16: true
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 200
  eval_strategy: "steps"
  eval_steps: 200
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  report_to: "none"
  seed: 42
  
  # Ativar checkpointing economiza VRAM substancialmente, embora deixe o 
  # forward pass um pouco mais lento.
  gradient_checkpointing: true

distillation:
  teacher_model_id: "Qwen/Qwen2.5-7B-Instruct"
  temperature: 2.0
  lmbda: 0.5
  beta: 0.5

pruning:
  sparsity_ratio: 0.5
  num_calibration_samples: 32

quantization:
  zero_point: true
  q_group_size: 128
  w_bit: 4
  version: "GEMM"

dpo:
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-7 # LR muito mais baixo que o SFT
  beta: 0.1
  max_length: 1024
  max_prompt_length: 512

evaluation:
  output_dir: "./results/eval_output"
  
logging:
  results_dir: "./results"
